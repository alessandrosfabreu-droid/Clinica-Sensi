<title>Painel Clínica Sensi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
/* ===== Layout concept: single-page dashboard, top-level tab switcher (Prazo / Custo / Fotos / Próximos Passos),
   summary-first cards, horizontal meter bars for budget comparisons, lightbox photo gallery.
   Visual identity continues the "Template AA" house style already used across the project's PDF/Excel deliverables:
   warm sand paper ground, dark-brown ink, gold accent, Georgia display + Inter body/data. ===== */
:root{
  --bg:#f6f0df; --surface:#ffffff; --surface-soft:#fbf6e8; --surface-raised:#fffdf7;
  --ink:#3d3324; --ink-soft:#73614a; --ink-faint:#a8977c;
  --accent:#a17c2f; --accent-soft:#d9b871; --accent-softer:#eadfbc;
  --line:#e1d3a9; --line-soft:#ece2c4;
  --good:#4f7a4a; --good-soft:#e3ecdd;
  --warn:#b3762c; --warn-soft:#f3e6cf;
  --bad:#9a3b2a; --bad-soft:#f3ddd6;
  --shadow: 0 1px 2px rgba(61,51,36,.06), 0 8px 24px -12px rgba(61,51,36,.18);
  --font-display:'Inter',system-ui,-apple-system,sans-serif;
  --font-body:'Inter',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#211a10; --surface:#2c2316; --surface-soft:#352a19; --surface-raised:#3a2f1c;
    --ink:#f2e6c8; --ink-soft:#cbb98f; --ink-faint:#8d7c5c;
    --accent:#e3c884; --accent-soft:#b48f45; --accent-softer:#4a3c22;
    --line:#4a3c22; --line-soft:#3a2f1c;
    --good:#9bc18f; --good-soft:#2c3326;
    --warn:#e3b56a; --warn-soft:#3a2f1c;
    --bad:#e2897a; --bad-soft:#3a2420;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#211a10; --surface:#2c2316; --surface-soft:#352a19; --surface-raised:#3a2f1c;
  --ink:#f2e6c8; --ink-soft:#cbb98f; --ink-faint:#8d7c5c;
  --accent:#e3c884; --accent-soft:#b48f45; --accent-softer:#4a3c22;
  --line:#4a3c22; --line-soft:#3a2f1c;
  --good:#9bc18f; --good-soft:#2c3326;
  --warn:#e3b56a; --warn-soft:#3a2f1c;
  --bad:#e2897a; --bad-soft:#3a2420;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px 64px}
::selection{background:var(--accent-soft);color:var(--ink)}
h1,h2,h3{font-family:var(--font-display);font-weight:800;letter-spacing:-.01em;text-wrap:balance;margin:0}
.eyebrow{font-family:var(--font-body);font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.num{font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
header.top{
  background:linear-gradient(115deg,var(--ink) 0%, #4c4024 55%, var(--accent) 140%);
  color:#f3ead2; padding:28px 16px 22px; position:relative; overflow:hidden;
}
:root[data-theme="dark"] header.top{
  background:linear-gradient(115deg,#140f09 0%, #332a18 55%, var(--accent) 160%);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) header.top{
  background:linear-gradient(115deg,#140f09 0%, #332a18 55%, var(--accent) 160%);
} }
header.top::after{content:"";position:absolute;inset:0;background:
  radial-gradient(480px 220px at 85% -20%, rgba(227,200,132,.35), transparent 70%);
  pointer-events:none}
.top-inner{max-width:1040px;margin:0 auto;position:relative;z-index:1}
.top-eyebrow{font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:#e3c884;opacity:.95}
header.top h1{font-size:25px;font-weight:800;letter-spacing:-.01em;color:#fff;margin-top:4px}
header.top p.sub{margin:6px 0 0;font-size:13.5px;color:#e9dfc4;opacity:.92}
.updated-pill{display:inline-flex;align-items:center;gap:6px;margin-top:14px;background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:5px 12px;font-size:12px;color:#f3ead2}
.updated-pill .dot{width:6px;height:6px;border-radius:50%;background:#9bd18a;box-shadow:0 0 0 3px rgba(155,209,138,.25)}
.theme-toggle{position:absolute;top:18px;right:16px;z-index:2;width:38px;height:38px;border-radius:50%;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#f3ead2;display:flex;
  align-items:center;justify-content:center;cursor:pointer;transition:background .15s}
.theme-toggle:hover{background:rgba(255,255,255,.2)}
.theme-toggle svg{width:18px;height:18px}
.pdf-export-btn{position:absolute;top:18px;right:64px;z-index:2;height:38px;border-radius:999px;padding:0 13px;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#f3ead2;display:flex;
  align-items:center;gap:6px;cursor:pointer;transition:background .15s;font-family:inherit;font-size:12px;font-weight:700}
.pdf-export-btn:hover{background:rgba(255,255,255,.2)}
.pdf-export-btn svg{width:16px;height:16px;flex:none}

/* ---------- tabs ---------- */
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs-inner{max-width:1040px;margin:0 auto;display:flex;gap:2px;padding:0 10px;overflow-x:auto;scrollbar-width:none}
.tabs-inner::-webkit-scrollbar{display:none}
.tab-btn{flex:0 0 auto;appearance:none;border:none;background:none;font-family:var(--font-body);font-weight:600;
  font-size:13.5px;color:var(--ink-soft);padding:14px 14px 12px;cursor:pointer;border-bottom:2.5px solid transparent;
  display:flex;align-items:center;gap:7px;white-space:nowrap;transition:color .15s}
.tab-btn svg{width:16px;height:16px;flex:none}
.tab-btn:hover{color:var(--ink)}
.tab-btn[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}

main{padding-top:22px}
section.panel{display:flex;flex-direction:column;gap:18px}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 18px 20px;box-shadow:var(--shadow)}
.card-title{position:relative;font-family:var(--font-display);font-size:16px;font-weight:700;margin:0 0 2px;padding-left:12px}
.card-title::before{content:"";position:absolute;left:0;top:2px;bottom:2px;width:3px;border-radius:2px;background:var(--accent)}
.card-sub{font-size:12.5px;color:var(--ink-soft);margin:0 0 14px 12px;line-height:1.5}

/* ---------- kpi row (cards individuais em grade) ---------- */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.kpi{background:var(--surface-soft);border:1px solid var(--line);border-radius:14px;padding:14px 15px;min-width:0}
.kpi .k-label{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint)}
.kpi .k-value{font-family:var(--font-display);font-size:20px;font-weight:800;margin-top:4px;color:var(--ink);
  overflow-wrap:anywhere;line-height:1.2;white-space:nowrap}
@media (max-width:420px){ .kpi .k-value{font-size:18px} }
.kpi .k-value.accent{color:var(--accent)}
.kpi .k-note{font-size:11.5px;color:var(--ink-soft);margin-top:3px}

/* ---------- ring ---------- */
.ring-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.ring{flex:none}
.ring-label{font-size:12px;color:var(--ink-soft)}
.ring-value{font-family:var(--font-display);font-size:30px;font-weight:700}

/* ---------- meter rows (orçado x realizado por grupo) ---------- */
.meter-row{padding:10px 0;border-bottom:1px solid var(--line-soft)}
.meter-row:last-child{border-bottom:none}
.meter-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.meter-name{font-size:13px;font-weight:600;color:var(--ink)}
.meter-vals{font-size:12px;color:var(--ink-soft);white-space:nowrap}
.meter-vals b{color:var(--ink);font-weight:700}
.meter-track{position:relative;height:9px;border-radius:999px;background:var(--surface-soft);border:1px solid var(--line);overflow:hidden}
.meter-fill{position:absolute;inset:0 auto 0 0;border-radius:999px;background:linear-gradient(90deg,var(--accent-soft),var(--accent))}
.meter-fill.over{background:linear-gradient(90deg,var(--bad),#c4583f)}
.meter-pct{font-size:11px;color:var(--ink-faint);margin-top:4px}

/* ---------- pills / badges ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:700}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.neutral{background:var(--surface-soft);color:var(--ink-soft);border:1px solid var(--line)}
.badge-num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;
  background:var(--accent);color:#fff;font-size:11px;font-weight:700;flex:none}
:root[data-theme="dark"] .badge-num{color:#241d10}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .badge-num{color:#241d10} }

/* ---------- lista simples ---------- */
.list-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:13px}
.list-row:last-child{border-bottom:none}
.list-row .l-name{color:var(--ink);font-weight:500}
.list-row .l-sub{color:var(--ink-faint);font-size:11.5px;display:block;margin-top:1px}
.list-row .l-val{font-weight:700;color:var(--ink);white-space:nowrap}
.receipt-block{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.receipt-accordion-btn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;appearance:none;border:none;background:none;padding:0;cursor:pointer;font-family:inherit;text-align:left}
.receipt-accordion-btn:focus-visible{outline:1.5px solid var(--accent);outline-offset:3px;border-radius:6px}
.receipt-accordion-count{display:block;font-size:12px;color:var(--ink-soft);font-weight:500;margin-top:2px}
.receipt-accordion-chevron{flex:none;color:var(--ink-faint);transition:transform .2s ease}
.receipt-accordion-btn[aria-expanded="true"] .receipt-accordion-chevron{transform:rotate(180deg)}
.receipt-accordion-body{margin-top:10px}
.receipt-group-title{font-size:11px;font-weight:700;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 6px}
.receipt-group-title:first-of-type{margin-top:0}
.receipt-row{display:flex;align-items:center;gap:10px;padding:8px 6px;margin:0 -6px;border-bottom:1px solid var(--line-soft);border-radius:8px}
.receipt-row:last-child{border-bottom:none}
.receipt-row.has-receipt{cursor:pointer;transition:background-color .15s ease}
.receipt-row.has-receipt:hover, .receipt-row.has-receipt:focus-visible{background:var(--surface-soft)}
.receipt-row.has-receipt:focus-visible{outline:1.5px solid var(--accent);outline-offset:1px}
.receipt-icon{width:34px;height:34px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--accent-softer);color:var(--accent)}
.receipt-icon svg{width:17px;height:17px}
.receipt-icon-empty{background:var(--surface-soft);color:var(--ink-faint)}
.receipt-info{flex:1;min-width:0}
.receipt-desc{font-size:12.5px;font-weight:600;color:var(--ink)}
.receipt-meta{font-size:11px;color:var(--ink-soft);margin-top:1px}
.receipt-noproof{color:var(--ink-faint);font-style:italic}
.receipt-val{font-size:12.5px;font-weight:700;color:var(--ink);white-space:nowrap;flex:none}

/* ---------- timeline (prazo) ---------- */
.timeline{display:flex;flex-direction:column;gap:0}
.tl-item{display:flex;gap:14px;position:relative}
.tl-rail{display:flex;flex-direction:column;align-items:center;flex:none}
.tl-dot{width:11px;height:11px;border-radius:50%;background:var(--accent);margin-top:5px;box-shadow:0 0 0 4px var(--accent-softer)}
.tl-line{flex:1;width:2px;background:var(--line);margin-top:2px}
.tl-item:last-child .tl-line{display:none}
.tl-body{padding-bottom:20px;flex:1;min-width:0}
.tl-dates{font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.03em;text-transform:uppercase}
.tl-name{font-size:14px;font-weight:700;margin:3px 0 2px}
.tl-meta{font-size:12px;color:var(--ink-soft)}

/* ---------- progress bar (prazo hero) ---------- */
.bigbar{height:14px;border-radius:999px;background:var(--surface-soft);border:1px solid var(--line);overflow:hidden;position:relative}
.bigbar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent-soft),var(--accent))}
.bigbar-today{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}

/* ---------- gallery ---------- */
.gallery-group{margin-bottom:22px;border-radius:12px;transition:box-shadow .3s ease, background-color .3s ease}
.gallery-group:last-child{margin-bottom:0}
.gallery-group.gg-highlight{box-shadow:0 0 0 2px var(--accent);background:var(--surface-soft)}
.gg-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.gg-title{font-size:14px;font-weight:700;color:var(--ink)}
.gg-range{font-size:11.5px;color:var(--ink-soft)}
.grid-photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:8px}
.photo-thumb{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--line);
  cursor:pointer;background:var(--surface-soft)}
.photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s}
.photo-thumb:hover img{transform:scale(1.06)}
.photo-thumb .pn{position:absolute;top:5px;left:5px;background:rgba(36,29,16,.72);color:#f3ead2;font-size:10px;
  font-weight:700;padding:2px 6px;border-radius:999px}

/* ---------- lightbox ---------- */
.lightbox{position:fixed;inset:0;background:rgba(18,14,8,.92);z-index:100;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));
  padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.lb-img-wrap{max-width:min(900px,94vw);max-height:62vh;display:flex;align-items:center;justify-content:center}
.lightbox img{max-width:100%;max-height:62vh;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.lb-cap{max-width:min(680px,92vw);color:#f3ead2;text-align:center;margin-top:14px}
.lb-cap .lb-label{font-weight:700;font-size:14.5px}
.lb-cap .lb-meta{font-size:12px;color:#cbb98f;margin-top:3px}
.lb-cap .lb-obs{font-size:12px;color:#d9c79a;margin-top:8px;line-height:1.5;max-height:72px;overflow:auto}
.lb-controls{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;display:flex;gap:8px}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#f3ead2;display:flex;
  align-items:center;justify-content:center;cursor:pointer;font-size:18px}
.lb-nav.prev{left:10px}.lb-nav.next{right:10px}
.lb-close{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);
  color:#f3ead2;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px}

/* ---------- empty state ---------- */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:34px 18px;color:var(--ink-soft)}
.empty svg{width:40px;height:40px;color:var(--accent-soft)}
.empty h3{font-size:15px;color:var(--ink)}
.empty p{font-size:12.5px;max-width:320px;margin:0;line-height:1.55}

/* ---------- insumos flag list ---------- */
.flag-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;
  background:var(--bad-soft);margin-bottom:7px}
.flag-item:last-child{margin-bottom:0}
.flag-name{font-size:12.5px;font-weight:600;color:var(--ink)}
.flag-code{font-size:10.5px;color:var(--ink-faint);font-family:ui-monospace,monospace}
.flag-pct{font-size:14px;font-weight:800;color:var(--bad);white-space:nowrap}

/* ---------- split stats ---------- */
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.split-3{grid-template-columns:repeat(3,1fr)}
@media (max-width:560px){ .split-3{grid-template-columns:1fr} }
.split .s-card{min-width:0;border-radius:12px;padding:13px 14px;background:var(--surface-soft);border:1px solid var(--line)}
.split .s-label{font-size:11px;color:var(--ink-faint);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.split .s-val{font-family:var(--font-display);font-size:19px;font-weight:700;margin-top:3px;white-space:nowrap;overflow-wrap:anywhere}

footer.foot{max-width:1040px;margin:30px auto 0;padding:0 16px;font-size:11.5px;color:var(--ink-faint);text-align:center}

/* ---------- line chart (previsto x executado) ---------- */
.linechart{width:100%;height:auto;overflow:visible}
.linechart .gridline{stroke:var(--line-soft);stroke-width:1}
.linechart .axis-label{font-family:var(--font-body);font-size:10.5px;fill:var(--ink-faint)}
.linechart .lc-prev{fill:none;stroke:var(--accent-soft);stroke-width:2.5;stroke-dasharray:5 4}
.linechart .lc-exec{fill:none;stroke:var(--accent);stroke-width:2.75}
.linechart .lc-dot{stroke:var(--surface);stroke-width:2}
.lc-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:var(--ink-soft)}
.lc-legend span{display:inline-flex;align-items:center;gap:6px}
.lc-legend i{width:16px;height:2.5px;border-radius:2px;display:inline-block}

/* ---------- toggle switch (fotos: por serviço / linha do tempo) ---------- */
.toggle-group{display:inline-flex;background:var(--surface-soft);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.toggle-btn{appearance:none;border:none;background:none;font-family:var(--font-body);font-weight:600;font-size:12px;
  color:var(--ink-soft);padding:7px 14px;border-radius:999px;cursor:pointer;transition:background .15s,color .15s}
.toggle-btn.active{background:var(--accent);color:#fff}
:root[data-theme="dark"] .toggle-btn.active{color:#241d10}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .toggle-btn.active{color:#241d10} }

/* ---------- categoria bars (projeção) ---------- */
.cat-row{padding:11px 0;border-bottom:1px solid var(--line-soft)}
.cat-row:last-child{border-bottom:none}
.cat-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:3px}
.cat-name{font-size:13.5px;font-weight:700;color:var(--ink)}
.cat-desc{font-size:11.5px;color:var(--ink-faint);margin-bottom:6px}
.cat-track{height:20px;border-radius:7px;background:var(--surface-soft);border:1px solid var(--line);overflow:hidden;position:relative}
.cat-fill{height:100%;border-radius:7px 0 0 7px;background:linear-gradient(90deg,var(--ink) 0%,var(--accent) 160%);
  display:flex;align-items:center;justify-content:flex-end;padding-right:8px;min-width:fit-content}
.cat-fill .cv{font-size:11px;font-weight:700;color:#f3ead2;white-space:nowrap}

/* ---------- gantt (projeção) ---------- */
.gantt{overflow-x:auto}
.gantt-grid{min-width:560px}
.gantt-head{display:grid;grid-template-columns:200px repeat(4,1fr);font-size:10.5px;font-weight:700;color:var(--ink-faint);
  text-transform:uppercase;letter-spacing:.04em;padding-bottom:6px;border-bottom:1px solid var(--line)}
.gantt-row{display:grid;grid-template-columns:200px repeat(4,1fr);align-items:center;min-height:34px;border-bottom:1px solid var(--line-soft)}
.gantt-row:last-child{border-bottom:none}
.gantt-label{font-size:12px;color:var(--ink);padding-right:10px;line-height:1.3}
.gantt-track{position:relative;grid-column:2/6;height:20px;background:
  repeating-linear-gradient(to right,var(--line-soft) 0,var(--line-soft) 1px,transparent 1px,transparent 25%)}
.gantt-bar{position:absolute;top:2px;height:16px;border-radius:5px;background:linear-gradient(90deg,var(--accent-soft),var(--accent));
  display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;color:#3d3324;white-space:nowrap;padding:0 4px}
.gantt-bar.bar-plan{background:var(--surface-soft);border:1.5px dashed var(--accent-soft);color:var(--ink-soft);box-shadow:none}
.gantt-bar.bar-real{background:linear-gradient(90deg,var(--accent),var(--ink));color:#f3ead2}
.gantt-pair{padding:10px 0;border-bottom:1px solid var(--line-soft)}
.gantt-pair:last-child{border-bottom:none}
.gantt-pair-link{cursor:pointer;border-radius:8px;transition:background-color .15s ease;margin:0 -10px;padding-left:10px;padding-right:10px}
.gantt-pair-link:hover, .gantt-pair-link:focus-visible{background:var(--surface-soft)}
.gantt-pair-link:focus-visible{outline:1.5px solid var(--accent);outline-offset:2px}
.gantt-pair-label{font-size:12.5px;font-weight:700;color:var(--ink);margin-bottom:6px;max-width:280px}
.gantt-pair-cta{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;color:var(--accent);white-space:nowrap}
.gantt-pair-row{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.gantt-pair-row:last-child{margin-bottom:0}
.gantt-pair-tag{flex:none;width:68px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-faint)}
.gantt-pair-track{position:relative;flex:1;height:18px;background:
  repeating-linear-gradient(to right,var(--line-soft) 0,var(--line-soft) 1px,transparent 1px,transparent 25%)}
.gantt-legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px;font-size:11.5px;color:var(--ink-soft)}
.gantt-legend span{display:inline-flex;align-items:center;gap:6px}
.gantt-legend i{width:16px;height:10px;border-radius:3px;display:inline-block}

/* ---------- planilha de análise (custo item a item) ---------- */
.atbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.atbl{width:100%;border-collapse:collapse;min-width:760px;font-size:12px}
.atbl thead th{background:var(--ink);color:#f3ead2;text-align:right;font-size:10.5px;font-weight:700;text-transform:uppercase;
  letter-spacing:.03em;padding:9px 10px;white-space:nowrap}
.atbl thead th:first-child{text-align:left}
:root[data-theme="dark"] .atbl thead th{color:#1c160c}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .atbl thead th{color:#1c160c} }
.atbl tbody td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line-soft);color:var(--ink)}
.atbl tbody td:first-child{text-align:left;font-weight:600;white-space:normal;min-width:160px}
.atbl tbody tr:nth-child(even){background:var(--surface-soft)}
.atbl tbody tr:last-child td{border-bottom:none}
.atbl td.neg{color:var(--bad);font-weight:700;background:var(--bad-soft)}
.atbl td.pos{color:var(--good);font-weight:700}
.atbl td.dash{color:var(--ink-soft);font-weight:400}
.atbl tfoot td{padding:9px 10px;text-align:right;font-weight:800;background:var(--ink);color:#f3ead2;border-top:2px solid var(--accent)}
:root[data-theme="dark"] .atbl tfoot td{color:#1c160c}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .atbl tfoot td{color:#1c160c} }
.atbl tfoot td:first-child{text-align:left}
.atbl-more-row td{padding:10px;text-align:center;white-space:normal;background:var(--surface)}
.atbl-more-btn{display:inline-block;padding:7px 16px;border-radius:999px;border:1px solid var(--accent-soft);background:var(--surface-soft);color:var(--accent);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.atbl-more-btn:hover{background:var(--accent-soft);color:var(--ink)}
.atbl-done{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--surface-soft);border:1px solid var(--line)}
.atbl-done-title{font-size:11px;font-weight:700;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
.atbl-done-row{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:4px 10px;padding:6px 0;border-top:1px solid var(--line-soft)}
.atbl-done-row:first-of-type{border-top:none}
.atbl-done-name{font-size:12.5px;font-weight:700;color:var(--ink)}
.atbl-done-vals{display:flex;gap:14px;font-size:12px;font-weight:700;white-space:nowrap}
.atbl-done-vals .pos{color:var(--good)}
.atbl-done-vals .neg{color:var(--bad)}

/* ---------- EAP completa (hierarquia de níveis) ---------- */
.atbl.eap-full{min-width:900px}
.atbl.eap-full tbody td:nth-child(2){text-align:left;white-space:normal;min-width:170px;font-weight:inherit}
.atbl.eap-full tbody td:first-child{min-width:90px}
.eap-l1 td{font-weight:800;background:var(--surface-soft)}
.eap-l2 td{font-weight:700}
.eap-l3 td{font-weight:500}
.eap-l4 td{font-weight:400;color:var(--ink-soft)}
.eap-l2 td:nth-child(2){padding-left:20px}
.eap-l3 td:nth-child(2){padding-left:34px}
.eap-l4 td:nth-child(2){padding-left:48px}
.eap-summary-line{font-size:12.5px;color:var(--ink-soft);line-height:1.8;margin-bottom:10px}
.eap-summary-line b{color:var(--ink);font-weight:700}
.eap-summary-line b.accent{color:var(--accent)}
.eap-level-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.eap-level-label{font-size:11px;font-weight:700;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em}
.eap-level-btns{display:flex;gap:6px}
.eap-level-btn{appearance:none;border:1px solid var(--line);background:var(--surface-soft);color:var(--ink-soft);
  width:28px;height:28px;border-radius:999px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.eap-level-btn:hover{background:var(--accent-soft)}
.eap-level-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
:root[data-theme="dark"] .eap-level-btn.active{color:#241d10}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .eap-level-btn.active{color:#241d10} }

/* ---------- memorial de acabamentos (projeção) ---------- */
.mem-room{margin-bottom:14px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mem-room:last-child{margin-bottom:0}
.mem-room-head{background:linear-gradient(100deg,var(--ink),var(--accent-soft) 220%);color:#f3ead2;

/* ---------- exportação em PDF (impressão) ---------- */
@media print{
  @page{margin:14mm 10mm}
  body{background:#fff !important}
  nav.tabs, .theme-toggle, .pdf-export-btn,
  .atbl-more-row, .eap-level-row, .receipt-accordion-chevron, .receipt-accordion-count,
  .toggle-btn{display:none !important}
  #lightbox{display:none !important}
  header.top{position:static !important}
  .wrap{max-width:none !important}
  .panel{display:block !important;page-break-after:always;break-after:page}
  .panel:last-of-type{page-break-after:auto;break-after:auto}
  .card{break-inside:avoid;page-break-inside:avoid;border:1px solid #ccc !important;box-shadow:none !important}
  /* cards that can legitimately run longer than one page must be allowed to
     flow across pages instead of being forced whole onto one page (which,
     when they don't fit, makes the browser break them anyway in an ugly
     spot, e.g. right after the title, leaving an orphaned near-empty page) */
  .card-flow{break-inside:auto !important;page-break-inside:auto !important}
  .tl-item{break-inside:avoid;page-break-inside:avoid}
  .gallery-group{break-inside:avoid;page-break-inside:avoid}
  .atbl tbody tr[hidden]{display:table-row !important}
  .atbl-row-extra, .eap-full tbody tr{display:table-row !important}
  .receipt-accordion-body[hidden]{display:block !important}
  .receipt-accordion-btn{cursor:default !important;pointer-events:none}
  .atbl-wrap{overflow:visible !important}
  .atbl{min-width:0 !important;width:100%;table-layout:auto;font-size:9.5px}
  /* repeat the column header row (and total row) on every printed page a
     long table spans, so a continuation page never looks like it dropped
     a column such as Orçado/Realizado */
  .atbl thead{display:table-header-group}
  .atbl tfoot{display:table-footer-group}
  .atbl tbody tr{break-inside:avoid;page-break-inside:avoid}
  .atbl thead th, .atbl tbody td, .atbl tfoot td{padding:5px 5px}
  .atbl tbody td:first-child{min-width:0 !important}
  .atbl.eap-full{font-size:9px}
}

<script>
(function(){
  "use strict";
  var DATA = JSON.parse(document.getElementById('data-json').textContent);
  var BRL = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
  var PCT = function(v,d){d=d==null?1:d;return (v*100).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d})+'%';};
  var DATEFMT = function(iso){
    if(!iso) return '';
    var d = new Date(iso);
    var days=['dom','seg','ter','qua','qui','sex','sáb'];
    return String(d.getUTCDate()).padStart(2,'0')+'/'+String(d.getUTCMonth()+1).padStart(2,'0');
  };
  var DATEFULL = function(iso){
    if(!iso) return '';
    var d = new Date(iso);
    return String(d.getUTCDate()).padStart(2,'0')+'/'+String(d.getUTCMonth()+1).padStart(2,'0')+'/'+d.getUTCFullYear();
  };
  function el(tag, cls, html){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(html!=null) e.innerHTML = html;
    return e;
  }
  function esc(s){
    return (s==null?'':String(s)).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  /* ================= LINE CHART (previsto x executado) ================= */
  function lineChart(labels, series, opts){
    opts = opts || {};
    var W = opts.w || 600, H = opts.h || 220, padL = 54, padR = 14, padT = 14, padB = 26;
    var innerW = W - padL - padR, innerH = H - padT - padB;
    var allVals = [];
    series.forEach(function(s){ s.values.forEach(function(v){ allVals.push(v); }); });
    var max = Math.max.apply(null, allVals.concat([1]));
    max = max * 1.15;
    var n = labels.length;
    var x = function(i){ return padL + (n<=1?0:(innerW*i/(n-1))); };
    var y = function(v){ return padT + innerH - (innerH*v/max); };
    var svg = '<svg class="linechart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">';
    var steps = 4;
    for(var g=0; g<=steps; g++){
      var gv = max*g/steps;
      var gy = y(gv);
      svg += '<line class="gridline" x1="'+padL+'" x2="'+(W-padR)+'" y1="'+gy+'" y2="'+gy+'"/>';
      svg += '<text class="axis-label" x="'+(padL-8)+'" y="'+(gy+3)+'" text-anchor="end">'+fmtShortBRL(gv)+'</text>';
    }
    labels.forEach(function(lab,i){
      svg += '<text class="axis-label" x="'+x(i)+'" y="'+(H-6)+'" text-anchor="middle">'+esc(lab)+'</text>';
    });
    series.forEach(function(s){
      var d = s.values.map(function(v,i){ return (i===0?'M':'L')+x(i).toFixed(1)+' '+y(v).toFixed(1); }).join(' ');
      svg += '<path class="'+s.cls+'" d="'+d+'"/>';
      s.values.forEach(function(v,i){
        svg += '<circle class="lc-dot" cx="'+x(i).toFixed(1)+'" cy="'+y(v).toFixed(1)+'" r="3.6" fill="'+s.dot+'"/>';
      });
    });
    svg += '</svg>';
    return svg;
  }
  function fmtShortBRL(v){
    if(v>=1000) return 'R$ '+(v/1000).toLocaleString('pt-BR',{maximumFractionDigits:0})+'k';
    return 'R$ '+v.toLocaleString('pt-BR',{maximumFractionDigits:0});
  }

  /* ================= PRAZO ================= */
  function renderPrazo(){
    var p = DATA.prazo;
    var start = new Date(p.inicio+'T00:00:00Z'), end = new Date(p.fim+'T00:00:00Z'), today = new Date(p.hoje+'T00:00:00Z');
    var totalDays = Math.round((end-start)/86400000);
    var elapsed = Math.max(0, Math.min(totalDays, Math.round((today-start)/86400000)));
    var remaining = totalDays - elapsed;
    var pct = totalDays>0 ? elapsed/totalDays : 0;
    var pe = p.previsto_executado || [];
    var antesCount = pe.filter(function(r){return r.real_start_band < r.planejado_start_band;}).length;

    var panel = document.getElementById('panel-prazo');
    panel.innerHTML = '';

    var hero = el('div','card');
    hero.innerHTML =
      '<div class="card-title">Resumo do prazo</div>'+
      '<p class="card-sub">Início em '+DATEFULL(p.inicio)+' · entrega prevista em '+DATEFULL(p.fim)+'</p>'+
      '<div class="kpi-row" style="margin-bottom:16px">'+
        '<div class="kpi"><div class="k-label">Dias corridos</div><div class="k-value num">'+elapsed+'</div><div class="k-note">de '+totalDays+' dias totais</div></div>'+
        '<div class="kpi"><div class="k-label">Dias restantes</div><div class="k-value num accent">'+remaining+'</div><div class="k-note">até '+DATEFULL(p.fim)+'</div></div>'+
        '<div class="kpi"><div class="k-label">% prazo decorrido</div><div class="k-value num">'+PCT(pct,0)+'</div><div class="k-note">em relação ao total</div></div>'+
        '<div class="kpi"><div class="k-label">Atividades adiantadas</div><div class="k-value num accent">'+antesCount+'</div><div class="k-note">iniciadas antes do planejado</div></div>'+
      '</div>'+
      '<div class="bigbar"><div class="bigbar-fill" style="width:'+(pct*100)+'%"></div></div>';
    panel.appendChild(hero);

    var peCard = el('div','card');
    var months = ['SET','OUT','NOV','DEZ'];
    var totalBands = p.previsto_executado_bands || 4;
    var ph = '<div class="card-title">Planejado × Executado</div>'+
      '<p class="card-sub">Planejamento original comparado ao realizado em obra</p>'+
      '<div class="gantt-legend"><span><i style="background:var(--surface-soft);border:1.5px dashed var(--accent-soft)"></i>Planejado</span><span><i style="background:linear-gradient(90deg,var(--accent),var(--ink))"></i>Executado</span></div>'+
      '<div class="gantt"><div class="gantt-grid" style="min-width:480px">'+
      '<div style="display:flex;gap:8px;padding-bottom:6px;margin-bottom:4px;border-bottom:1px solid var(--line)">'+
      '<div style="flex:none;width:68px"></div><div style="flex:1;display:grid;grid-template-columns:repeat(4,1fr);font-size:10.5px;font-weight:700;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em">'+
      months.map(function(m){return '<div>'+m+'</div>';}).join('')+'</div></div>';
    pe.forEach(function(r,idx){
      var pLeft=r.planejado_start_band/totalBands*100, pW=r.planejado_w_band/totalBands*100;
      var rLeft=r.real_start_band/totalBands*100, rW=r.real_w_band/totalBands*100;
      ph += '<div class="gantt-pair gantt-pair-link" data-pe-idx="'+idx+'" role="button" tabindex="0">'+
        '<div class="gantt-pair-label">'+esc(r.atividade_planejada)+' <span style="font-weight:400;color:var(--ink-faint)">· '+r.duracao+'d planejados</span><span class="gantt-pair-cta">Ver fotos ›</span></div>'+
        '<div class="gantt-pair-row"><span class="gantt-pair-tag">Planejado</span><div class="gantt-pair-track"><div class="gantt-bar bar-plan" style="left:'+pLeft+'%;width:'+pW+'%"></div></div></div>'+
        '<div class="gantt-pair-row"><span class="gantt-pair-tag">Executado</span><div class="gantt-pair-track"><div class="gantt-bar bar-real" style="left:'+rLeft+'%;width:'+rW+'%"></div></div></div>'+
        '</div>';
    });
    ph += '</div></div>';
    peCard.innerHTML = ph;

        '<div class="eap-level-row"><span class="eap-level-label">Nível de detalhe</span><div class="eap-level-btns" id="eapLevelBtns">';
      for(var lv=1; lv<=eapMaxLevel; lv++){

        '<div class="atbl-wrap"><table class="atbl eap-full"><thead><tr><th>Código</th><th>Descrição</th><th>Und.</th><th>Qtd.</th><th>Preço unit.</th><th>Orçado</th></tr></thead><tbody>';
      eapRows.forEach(function(g){
        eapH += '<tr class="eap-l'+g.nivel+'" data-nivel="'+g.nivel+'"><td>'+esc(g.code)+'</td><td>'+esc(titleCase(g.desc))+'</td>'+
          '<td>'+(g.und?esc(g.und):'')+'</td><td>'+(g.quant!=null?g.quant:'')+'</td>'+
          '<td>'+(g.preco_unit!=null?BRL.format(g.preco_unit):'')+'</td>'+
          '<td class="num">'+BRL.format(g.orc)+'</td></tr>';

  function titleCase(s){
    if(!s) return '';
    return s.charAt(0).toUpperCase()+s.slice(1);
  }

  /* ================= FOTOS ================= */
  var allPhotos = [];
  var fotosMode = 'tempo';
  function renderFotos(){
    var panel = document.getElementById('panel-fotos');
    panel.innerHTML = '';
    allPhotos = DATA.obra.fotos;

    var hero = el('div','card');
    hero.innerHTML = '<div class="card-title">Registro fotográfico</div>'+
      '<p class="card-sub">'+allPhotos.length+' fotos · toque em uma foto para ampliar</p>'+
      '<div class="toggle-group">'+
        '<button class="toggle-btn" data-mode="servico">Agrupar por serviço</button>'+
        '<button class="toggle-btn" data-mode="tempo">Linha do tempo</button>'+
      '</div>';
    panel.appendChild(hero);
    hero.querySelectorAll('.toggle-btn').forEach(function(b){
      if(b.getAttribute('data-mode')===fotosMode) b.classList.add('active');
      b.addEventListener('click', function(){
        fotosMode = b.getAttribute('data-mode');
        renderFotos();
      });
    });

    var gc = el('div');
    if(fotosMode==='servico'){
      DATA.obra.etapas.forEach(function(etapa){
        var photos = allPhotos.filter(function(f){return f.etapa===etapa.nome});
        var card = el('div','card gallery-group');
        card.setAttribute('data-etapa', etapa.nome);
        var range = etapa.inicio===etapa.fim ? DATEFULL(etapa.inicio) : DATEFMT(etapa.inicio)+' – '+DATEFULL(etapa.fim);
        var h = '<div class="gg-head"><span class="gg-title">'+esc(etapa.nome_exib)+'</span><span class="gg-range">'+range+'</span></div><div class="grid-photos">';
        photos.forEach(function(f){
          h += '<div class="photo-thumb" data-n="'+f.n+'"><img src="'+f.img+'" loading="lazy" alt="'+esc(f.label)+'"><span class="pn">'+String(f.n).padStart(2,'0')+'</span></div>';
        });
        h += '</div>';
        card.innerHTML = h;
        gc.appendChild(card);
      });
    } else {
      var sorted = allPhotos.slice().sort(function(a,b){
        if(a.data!==b.data) return a.data<b.data?-1:1;
        return a.n-b.n;
      });
      var byDay = {}; var order = [];
      sorted.forEach(function(f){
        if(!byDay[f.data]){byDay[f.data]=[];order.push(f.data);}
        byDay[f.data].push(f);
      });
      var card = el('div','card card-flow');
      var h = '<div class="timeline">';
      order.forEach(function(day){
        var photos = byDay[day];
        var first = photos[0];
        h += '<div class="tl-item"><div class="tl-rail"><div class="tl-dot"></div><div class="tl-line"></div></div>'+
          '<div class="tl-body"><div class="tl-dates">'+first.dia_semana+', '+DATEFULL(day)+'</div>'+
          '<div class="tl-meta" style="margin-bottom:8px">'+photos.length+' foto'+(photos.length>1?'s':'')+' · '+esc(first.etapa_exib)+'</div>'+
          '<div class="grid-photos">';
        photos.forEach(function(f){
          h += '<div class="photo-thumb" data-n="'+f.n+'"><img src="'+f.img+'" loading="lazy" alt="'+esc(f.label)+'"><span class="pn">'+String(f.n).padStart(2,'0')+'</span></div>';
        });
        h += '</div></div></div>';
      });
      h += '</div>';
      card.innerHTML = h;
      gc.appendChild(card);
    }
    panel.appendChild(gc);

    panel.querySelectorAll('.photo-thumb').forEach(function(t){
      t.addEventListener('click', function(){ openLightbox(parseInt(t.getAttribute('data-n'),10)); });
    });
  }

  var lbIndex = -1;
  var lbList = [];
  function openLightbox(n){
    var idx = allPhotos.findIndex(function(f){return f.n===n});
    if(idx<0) return;
    lbList = allPhotos.map(function(f){
      return {img:f.img, label:f.label, meta:'Nº '+String(f.n).padStart(2,'0')+' · '+f.dia_semana+', '+DATEFULL(f.data)+' · '+f.etapa_exib, obs:f.obs||''};
    });
    lbIndex = idx;
    showLb();
    document.getElementById('lightbox').hidden = false;
  }
  function openLightboxList(list, idx){
    if(!list.length) return;
    lbList = list;
    lbIndex = idx;
    showLb();
    document.getElementById('lightbox').hidden = false;
  }
  function showLb(){
    var f = lbList[lbIndex];
    document.getElementById('lbImg').src = f.img;
    document.getElementById('lbImg').alt = f.label||'';
    document.getElementById('lbLabel').textContent = f.label||'';
    document.getElementById('lbMeta').textContent = f.meta||'';
    document.getElementById('lbObs').textContent = f.obs || '';
  }
  function closeLb(){ document.getElementById('lightbox').hidden = true; }
  document.getElementById('lbClose').addEventListener('click', closeLb);
  document.getElementById('lightbox').addEventListener('click', function(e){ if(e.target.id==='lightbox') closeLb(); });
  document.getElementById('lbPrev').addEventListener('click', function(){ lbIndex=(lbIndex-1+lbList.length)%lbList.length; showLb(); });
  document.getElementById('lbNext').addEventListener('click', function(){ lbIndex=(lbIndex+1)%lbList.length; showLb(); });
  document.addEventListener('keydown', function(e){
    if(document.getElementById('lightbox').hidden) return;
    if(e.key==='Escape') closeLb();
    if(e.key==='ArrowLeft') document.getElementById('lbPrev').click();
    if(e.key==='ArrowRight') document.getElementById('lbNext').click();
  });

    pr.categorias.forEach(function(c){
      ch += '<div class="cat-row"><div class="cat-top"><span class="cat-name">'+esc(c.nome)+'</span><span class="meter-vals"><b>'+BRL.format(c.valor)+'</b> · '+PCT(c.pct,1)+'</span></div>'+
        '<div class="cat-desc">'+esc(c.desc)+'</div>'+
        '<div class="cat-track"><div class="cat-fill" style="width:'+Math.max(10,c.pct*100)+'%"><span class="cv"></span></div></div></div>';
    });
    ch += '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)">'+
      '<span style="font-size:13px;font-weight:700">Custo projetado total</span>'+
      '<span style="font-family:var(--font-display);font-size:19px;font-weight:700;color:var(--accent)">'+BRL.format(pr.categorias_total)+'</span></div>';
    cc.innerHTML = ch;
    panel.appendChild(cc);

    // ---- curva ABC (derivada dos mesmos 63 insumos já usados na aba Custo, garantindo consistência) ----
    var insumos = DATA.custo.insumos.slice();
    var classes = {A:{n:0,v:0},B:{n:0,v:0},C:{n:0,v:0}};
    insumos.forEach(function(i){ classes[i.cls].n++; classes[i.cls].v+=i.orc; });
    var totOrc = insumos.reduce(function(a,i){return a+i.orc;},0);
    var top15 = insumos.slice().sort(function(a,b){return b.orc-a.orc;}).slice(0,15);
    var top15sum = top15.reduce(function(a,i){return a+i.orc;},0);

    var abc = el('div','card');
    var ah = '<div class="card-title">Curva ABC de insumos</div>'+
      '<p class="card-sub">'+PCT(top15sum/totOrc,1)+' do custo está concentrado em apenas 15 itens ('+PCT(15/insumos.length,0)+' dos insumos) — onde atuar para economizar, do maior para o menor peso</p>'+
      '<div class="split split-3" style="margin-bottom:16px">';
    ['A','B','C'].forEach(function(k){
      ah += '<div class="s-card"><div class="s-label">Classe '+k+'</div><div class="s-val num">'+BRL.format(classes[k].v)+'</div>'+
        '<div class="k-note" style="margin-top:2px">'+classes[k].n+' itens · '+PCT(classes[k].v/totOrc,1)+'</div></div>';
    });
    ah += '</div>';
    var cum = 0;
    top15.forEach(function(i,idx){
      cum += i.orc;
      ah += '<div class="meter-row"><div class="meter-top"><span class="meter-name">'+String(idx+1).padStart(2,'0')+' · '+esc(titleCase(i.desc))+'</span>'+
        '<span class="meter-vals">'+BRL.format(i.orc)+' · '+PCT(i.orc/totOrc,1)+'</span></div>'+
        '<div class="meter-track"><div class="meter-fill" style="width:'+(i.orc/top15[0].orc*100)+'%"></div></div>'+
        '<div class="meter-pct">acumulado '+PCT(cum/totOrc,1)+'</div></div>';
    });
    abc.innerHTML = ah;
    panel.appendChild(abc);

    // ---- planejamento da obra (gantt) ----
    var gc = el('div','card');
    var months = ['SET','OUT','NOV','DEZ'];
    var gh = '<div class="card-title">Planejamento da obra</div><p class="card-sub">Sequência e duração de cada etapa, como projetadas originalmente</p>'+
      '<div class="gantt"><div class="gantt-grid">'+
      '<div class="gantt-head"><div></div>'+months.map(function(m){return '<div>'+m+'</div>';}).join('')+'</div>';
    pr.gantt.forEach(function(t){
      gh += '<div class="gantt-row"><div class="gantt-label">'+esc(t.nome)+'</div>'+
        '<div class="gantt-track"><div class="gantt-bar" style="left:'+(t.start/4*100)+'%;width:'+(t.w/4*100)+'%">'+t.dur+'</div></div></div>';
    });
    gh += '</div></div><p style="font-size:11px;color:var(--ink-faint);margin:12px 0 0;line-height:1.5">'+esc(pr.gantt_nota)+'</p>';
    gc.innerHTML = gh;
    panel.appendChild(gc);

    // ---- fluxo de caixa projetado (detalhado por mês) ----
    var fcard = el('div','card');
    var fh = '<div class="card-title">Fluxo de caixa projetado</div><p class="card-sub">Detalhamento dos itens que compõem o desembolso previsto em cada mês</p>';
    pr.fluxo_meses.forEach(function(m){
      fh += '<div style="margin:14px 0 2px;display:flex;justify-content:space-between;align-items:baseline">'+
        '<span style="font-size:13px;font-weight:700;color:var(--accent)">'+esc(m.mes).toUpperCase()+'</span>'+
        '<span style="font-family:var(--font-display);font-size:15px;font-weight:700">'+BRL.format(m.previsto)+'</span></div>';
      m.itens.forEach(function(it){
        fh += '<div class="list-row"><span class="l-name" style="font-weight:400">'+esc(it.nome)+'</span><span class="l-val" style="font-weight:600">'+BRL.format(it.valor)+'</span></div>';
      });
    });
    fh += '<div style="margin-top:16px;padding:13px 14px;border-radius:12px;background:var(--surface-soft);border:1px solid var(--line)">'+
      '<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);margin-bottom:6px">Premissas do fluxo de caixa</div>'+
      '<div style="font-size:12px;color:var(--ink-soft);line-height:1.6">Compra antecipada parcelada proporcionalmente ao longo do período da obra (Set–Dez), conforme antecedência de cada item:<ul style="margin:6px 0;padding-left:18px">'+
      pr.fluxo_premissas.map(function(p){return '<li>'+esc(p)+'</li>';}).join('')+
      '</ul>'+esc(pr.fluxo_premissas_extra)+'</div></div>';
    fcard.innerHTML = fh;
    panel.appendChild(fcard);

    // ---- memorial de acabamentos ----
    var mcard = el('div','card');
    var mh = '<div class="card-title">Memorial de acabamentos</div><p class="card-sub">Especificação de materiais por ambiente</p>';
    pr.memorial.forEach(function(room){
      mh += '<div class="mem-room"><div class="mem-room-head"><span>'+esc(room.nome)+'</span>'+(room.area?'<span class="mem-room-area">'+esc(room.area)+'</span>':'')+'</div>';
      room.itens.forEach(function(it){
        mh += '<div class="mem-item"><div class="mi-item">'+esc(it[0])+'</div><div class="mi-desc">'+esc(it[1])+'</div>'+(it[2]?'<div class="mi-obs">'+esc(it[2])+'</div>':'')+'</div>';
      });
      mh += '</div>';
    });
    mcard.innerHTML = mh;
    panel.appendChild(mcard);
  }

  /* ================= PRÓXIMOS PASSOS ================= */
  function renderPassos(){
    var panel = document.getElementById('panel-passos');
    panel.innerHTML = '';
    var items = DATA.proximos_passos || [];
    var card = el('div','card');
    if(!items.length){
      card.innerHTML =
        '<div class="empty">'+
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>'+
          '<h3>Nenhum item cadastrado ainda</h3>'+
          '<p>Assim que as próximas compras e atividades forem combinadas, elas aparecem aqui — é só avisar pelo chat, do mesmo jeito que os recibos e fotos.</p>'+
        '</div>';
    } else {
      var byCat = {};
      var order = [];
      items.forEach(function(it){
        var cat = it.categoria || 'Outros';
        if(!byCat[cat]){byCat[cat]=[];order.push(cat);}
        byCat[cat].push(it);
      });
      var h = '<div class="card-title">Próximos passos</div><p class="card-sub">Compras e atividades combinadas para as próximas semanas</p>';
      order.forEach(function(cat){
        h += '<div style="margin:14px 0 6px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--accent)">'+esc(cat)+'</div>';
        byCat[cat].forEach(function(it){
          var pillClass = it.status==='feito' ? 'good' : (it.status==='atrasado' ? 'bad' : 'neutral');
          var pillText = it.status==='feito' ? 'Concluído' : (it.status==='atrasado' ? 'Atrasado' : 'Planejado');
          h += '<div class="list-row"><div><span class="l-name">'+esc(it.titulo)+'</span>'+(it.quando?'<span class="l-sub">'+esc(it.quando)+'</span>':'')+'</div><span class="pill '+pillClass+'">'+pillText+'</span></div>';
        });
      });
      card.innerHTML = h;
    }
    panel.appendChild(card);
  }

  /* ================= TABS ================= */
  var panels = {prazo:'panel-prazo', custo:'panel-custo', fotos:'panel-fotos', passos:'panel-passos'};
  var renderers = {prazo:renderPrazo, custo:renderCusto, fotos:renderFotos, passos:renderPassos};
  var rendered = {};
  function selectTab(name){
    if(!panels[name]) name='prazo';
    Object.keys(panels).forEach(function(k){
      document.getElementById(panels[k]).hidden = (k!==name);
    });
    document.querySelectorAll('.tab-btn').forEach(function(b){
      b.setAttribute('aria-selected', b.getAttribute('data-tab')===name ? 'true':'false');
    });
    if(!rendered[name]){ renderers[name](); rendered[name]=true; }
    try{ if(location.hash.slice(1)!==name) history.replaceState(null,'','#'+name); }catch(e){}
  }

  function goToFotosEtapa(etapaNome){
    fotosMode = 'servico';
    renderFotos();
    rendered.fotos = true;
    selectTab('fotos');
    setTimeout(function(){
      var groups = document.querySelectorAll('#panel-fotos .gallery-group');
      var target = null;
      for(var i=0;i<groups.length;i++){ if(groups[i].getAttribute('data-etapa')===etapaNome){ target=groups[i]; break; } }
      if(target){
        target.scrollIntoView({behavior:'smooth', block:'start'});
        target.classList.add('gg-highlight');
        setTimeout(function(){ target.classList.remove('gg-highlight'); }, 1800);
      }
    }, 60);
  }
  document.querySelectorAll('.tab-btn').forEach(function(b){
    b.addEventListener('click', function(){ selectTab(b.getAttribute('data-tab')); });
  });
  window.addEventListener('hashchange', function(){ selectTab(location.hash.slice(1)); });

  var initial = location.hash ? location.hash.slice(1) : 'prazo';
  selectTab(initial);

  /* ================= EXPORTAR PDF ================= */
  function prepareAllTabsForExport(cb){
    Object.keys(renderers).forEach(function(k){
      if(!rendered[k]){ renderers[k](); rendered[k]=true; }
    });
    var imgs = Array.prototype.slice.call(document.querySelectorAll('img[loading="lazy"]'));
    imgs.forEach(function(img){ img.loading='eager'; });
    var pending = imgs.filter(function(img){ return !img.complete; });
    if(!pending.length){ if(cb) cb(); return; }
    var remaining = pending.length, done = false;
    function finish(){ if(done) return; done = true; if(cb) cb(); }
    pending.forEach(function(img){
      function onDone(){ remaining--; if(remaining<=0) finish(); }
      img.addEventListener('load', onDone, {once:true});
      img.addEventListener('error', onDone, {once:true});
    });
    setTimeout(finish, 4000);
  }
  document.getElementById('pdfExportBtn').addEventListener('click', function(){
    var btn = this, origText = btn.querySelector('span').textContent;
    btn.disabled = true; btn.querySelector('span').textContent = '...';
    prepareAllTabsForExport(function(){
      btn.disabled = false; btn.querySelector('span').textContent = origText;
      window.print();
    });
  });
  window.addEventListener('beforeprint', function(){ prepareAllTabsForExport(); });

  /* ================= THEME TOGGLE ================= */
  var sunIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.5M12 19v2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M2.5 12h2.5M19 12h2.5M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></svg>';
  var moonIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 14.3A8.5 8.5 0 1 1 9.7 4a7 7 0 0 0 10.3 10.3z"/></svg>';
  var root = document.documentElement;
  var btn = document.getElementById('themeToggle');
  function currentTheme(){
    var attr = root.getAttribute('data-theme');
    if(attr==='light' || attr==='dark') return attr;
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  function paintToggle(){
    btn.innerHTML = currentTheme()==='dark' ? sunIcon : moonIcon;
  }
  btn.addEventListener('click', function(){
    root.setAttribute('data-theme', currentTheme()==='dark' ? 'light' : 'dark');
    paintToggle();
  });
  paintToggle();
})();
</script>
